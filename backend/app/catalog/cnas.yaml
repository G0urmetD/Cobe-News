# yaml-language-server: $schema=schema/cnas.schema.json
# CNAs – who wrote a CVE record (cvelistV5: cveMetadata.assignerShortName; NVD: sourceIdentifier, an address or the
# CNA's UUID). The affected data of a CVE record is the vendor's own word („laut Hersteller“) only when its CNA is the
# product's vendor; another CNA's ranges are a third party's („laut GitHub (nicht der Hersteller)“) and never outweigh
# the NVD's analysis (app/vendor_match.cna_by). How to add one: docs/BETRIEB.md, section „Katalog pflegen“ → „CNAs“.
#
# A CNA listed here: the vendor of exactly the catalogue vendors under `vendors` (none: of no product). `ids`: its
# short name, addresses and UUID, compared without case; "*@<domain>" stands for every address at that domain.
# Any other CNA: the vendor when its short name or the domain of its address is the vendor's name (fortinet and
# psirt@fortinet.com for Fortinet, palo_alto and psirt@paloaltonetworks.com for Palo Alto Networks) – in whole words,
# followed only by a legal form or the like, never a generic word alone (cert.at is not cert-manager, phoenix.com –
# Phoenix Technologies – not Phoenix Contact; app/vendor_match._token_is) – else a third party. CERT@VDE and HackerOne
# write for vendors too, but no field of the record says for whom: third parties.
# Listed are the third parties that write records about other vendors' products, and the vendors this rule cannot see
# (the NVD names many CNAs only by their UUID – values from the NVD's source list, services.nvd.nist.gov/rest/json/source/2.0).
cnas:
  # ---------------------------------------------------------------- third parties: write about other vendors' products
  - key: github
    name: GitHub
    # GitHub_M: the GitHub Advisory Database (open-source projects' advisories) – GitHub_P: GitHub's own products
    ids: [GitHub_M, GitHub_P, security-advisories@github.com, product-cna@github.com, a0819718-46f1-4df5-94e2-005712e83aaa, 82327ea3-741d-41e4-88f8-2cf9e791e760]
    vendors: [GitHub]
