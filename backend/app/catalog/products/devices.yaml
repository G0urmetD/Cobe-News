# yaml-language-server: $schema=../schema/products.schema.json
# Vendor News catalogue – category 'devices' (Devices & firmware). How to add a product: docs/BETRIEB.md, section „Katalog pflegen“.
# An entry whose key is an endoflife.date product and that has no label only moves that product into this category
# (and may add CPEs, a version scheme or a hint).

# ---------------------------------------------------------------- storage, backup
- key: dell-idrac
  label: Dell iDRAC9
  vendor: Dell
  cpes: [o:dell:idrac9_firmware]
  cna: [[Dell, Integrated Dell Remote Access Controller 9], [Dell, iDRAC9]]  # Dell's newer records: "iDRAC9" (CVE-2026-23855)
  kw: [iDRAC]
  aliases: [iDRAC 9, Integrated Dell Remote Access Controller 9]
  example: 7.00.00.181
  where: idrac
