- key: jenkins
  label: Jenkins LTS
  vendor: Jenkins Project
  cpes: [a:jenkins:jenkins]
  cpe_editions: [[a:jenkins:jenkins, lts], [a:jenkins:jenkins, "*"]]  # NVD: lts; "-" is the weekly line
  cna: [[Jenkins Project, Jenkins]]
  osv: [[Maven, org.jenkins-ci.main:jenkins-core]]
  kw: [Jenkins]
  example: 2.492.2
  belongs: [{pattern: '^\s*v?2\.\d+\s*$', to: jenkins-weekly}]  # 2.499: a weekly release
  lines_only: lts  # only the LTS lines (endoflife.date: 2.568, 2.555 …) – 2.500.1 is no LTS release
- key: jenkins-weekly
  label: Jenkins Weekly
  vendor: Jenkins Project
  cpes: [a:jenkins:jenkins]
  eol: jenkins
  cpe_editions: [[a:jenkins:jenkins, "-"], [a:jenkins:jenkins, "*"]]  # NVD: "-" is weekly, lts the LTS line
  cna: [[Jenkins Project, Jenkins]]
  osv: [[Maven, org.jenkins-ci.main:jenkins-core]]
  kw: [Jenkins weekly]
  example: "2.499"
  depth: 2  # 2.499 is a whole weekly release
  belongs: [{pattern: '^\s*v?2\.\d+\.\d+\s*$', to: jenkins}]  # 2.492.2: an LTS release
