  vendor: Microsoft
  cpes: [o:microsoft:windows_server_2016, o:microsoft:windows_server_2019, o:microsoft:windows_server_2022, o:microsoft:windows_server_2025]
  eol: windows-server
  scheme: windows
  cna: [[Microsoft, Windows Server]]
  kw: [Remote Desktop Gateway, Remote Desktop Services, RD Gateway]
  aliases: [RDS, RD Gateway, RDGW, Terminal Server, Remote Desktop Session Host, RD Licensing]
  example: 10.0.20348.2762
  hint: windows_role
  where: windows_build
  filter: "Remote Desktop Gateway|Remote Desktop Services|Remote Desktop Licensing|RD Gateway"

