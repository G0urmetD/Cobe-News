  vendor: Microsoft
  cpes: [o:microsoft:windows_10_22h2, o:microsoft:windows_11_23h2, o:microsoft:windows_11_24h2, o:microsoft:windows_11_25h2]
  scheme: windows
  cna: [[Microsoft, Windows 1]]
  kw: [Windows 10, Windows 11]
  example: 10.0.26100.2605
  hint: windows
- key: windows-server
