# yaml-language-server: $schema=../schema/products.schema.json
# Vendor News catalogue – category 'passwords' (Password managers & PAM). How to add a product: docs/BETRIEB.md, section „Katalog pflegen“.
# An entry whose key is an endoflife.date product and that has no label only moves that product into this category
# (and may add CPEs, a version scheme or a hint).

# ---------------------------------------------------------------- Fortinet
- key: fortipam
  label: FortiPAM
  vendor: Fortinet
  cpes: [a:fortinet:fortipam]
  scheme: fortios
  adv: fortinet
  names: [FortiPAM]
  cna: [[Fortinet, FortiPAM]]
  kw: [FortiPAM]
  example: 1.5.0

