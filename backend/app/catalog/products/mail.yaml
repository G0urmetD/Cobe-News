# yaml-language-server: $schema=../schema/products.schema.json
# Vendor News catalogue – category 'mail' (Mail & mail security). How to add a product: docs/BETRIEB.md, section „Katalog pflegen“.
# An entry whose key is an endoflife.date product and that has no label only moves that product into this category
# (and may add CPEs, a version scheme or a hint).

# ---------------------------------------------------------------- Fortinet
- key: fortimail
  label: FortiMail
  vendor: Fortinet
  cpes: [a:fortinet:fortimail]
  scheme: fortios
  adv: fortinet
  names: [FortiMail]
  cna: [[Fortinet, FortiMail]]
  kw: [FortiMail]
  example: 7.6.2

# ---------------------------------------------------------------- Cisco
- key: cisco-esa
  label: Cisco Secure Email Gateway (ESA)
  vendor: Cisco
  cpes: [a:cisco:secure_email_gateway, o:cisco:secure_email_gateway_firmware, o:cisco:email_security_appliance_firmware, a:cisco:email_security_appliance, a:cisco:email_security_virtual_appliance]
  cna: [[Cisco, Cisco Secure Email], [Cisco, Cisco Secure Email Gateway]]
  kw: [Secure Email Gateway, Email Security Appliance, IronPort]
  aliases: [ESA, IronPort, Cisco Email Security Appliance, AsyncOS for Secure Email]
  example: 15.0.1
  where: web_about
  replaces: [cisco-sma]  # the key said SMA (the management appliance) while the product was ESA; a:cisco:asyncos was too broad (ESA, WSA and SMA) – migration 0025

