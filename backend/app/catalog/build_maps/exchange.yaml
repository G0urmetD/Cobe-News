# yaml-language-server: $schema=../schema/build_map_names.schema.json
# Microsoft Exchange Server: which build a cumulative update (CU) and security/hotfix update (SU/HU) is. Admins often
# say "2019 CU15" or "2019 CU15 Apr25HU"; Microsoft's CVE records compare builds (15.02.1748.024). A name typed for
# msexchange is looked up here and stored as the build (app/build_maps.py) – never guessed.
#
# Source (fetched 2026-11-02): Microsoft Learn "Exchange Server build numbers and release dates"
#   https://learn.microsoft.com/en-us/exchange/new-features/build-numbers-and-release-dates
# Taken: Exchange Server SE, 2019 and 2016 (2013 and older are out of support).
#
# A CU without an update ("2019 CU15", "SE RTM") is its line: 15.2.1748 stands for every build of CU15 – the matching
# decides only what holds for all of them (vendor_match.evaluate, catalogue depth 4); the CU's own release build is
# "2019 CU15 RTM". The name forms are Microsoft's: SU = security update, HU = hotfix update ("Apr25HU", "Nov24SUv2").
# A new update: add its row from the page above and raise catalog_version in catalog.yaml.
kind: names
fetched: "2026-11-02"
sources:
  - "https://learn.microsoft.com/en-us/exchange/new-features/build-numbers-and-release-dates"
products: [msexchange]
strip: [microsoft, exchange, server]
# "2019 CU12", "SE RTM", "2016 CU23 Mar23SU", AdminDisplayVersion "Version 15.2 (Build 1748.10)": not in the table → refused
claims: '(?i)\b(?:rtm|cu\s*\d+|se|subscription|[a-z]{3}\d{2}[sh]u(?:v\d)?)\b|^(?:(?:microsoft\s+)?exchange(?:\s+server)?\s+)?20(?:07|10|13|16|19)\b|\(\s*build\s'
hint: exchange_names
