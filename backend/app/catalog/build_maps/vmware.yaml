# yaml-language-server: $schema=../schema/build_map_vmware.schema.json
# VMware vCenter Server and ESXi: which release a version or build number is. Admins see vCenter's four-part version
# (VAMI → Summary, vSphere Client → About: 8.0.3.00400) and build numbers (24322831, ESXi: vmware -v → "VMware ESXi
# 8.0.3 build-24022510"); advisories name the release (8.0 U3d). A version entered for vcenter or esxi in one of these
# forms is looked up here and stored as the release (app/vmware_builds.py, the generic part app/build_maps.py) – unknown ones are refused, never guessed:
# the four-part suffixes follow no formula (vCenter 8.0 U3f and 7.0.3.00200/00400 do not exist).
#
# Sources (fetched 2026-11-02):
#   vCenter: Broadcom KB 326316 "Build numbers and versions of VMware vCenter Server"
#   ESXi:    Broadcom KB 316595 "Build numbers and versions of VMware ESXi/ESX"
# vCenter and ESXi have builds of their own (8.0 U3: vCenter 24022515, ESXi 24022510) – one table per product.
#
# release: as the vmware version scheme writes it (app/vendor_versions.py): "8.0 U3d" for 8.0 Update 3d, "8.0c" for a
# patch of the GA release (vCenter also writes "7.0.0d"), "8.0" for GA. Order: 8.0 < 8.0a < 8.0c < 8.0 U1 < 8.0 U1a.
# version: vCenter's four-part version (VAMI); build: the build number; date: release date. In the KB articles' order.
# A new release: add its row from the KB articles and raise catalog_version in catalog.yaml.
