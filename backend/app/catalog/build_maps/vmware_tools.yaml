# yaml-language-server: $schema=../schema/build_map_names.schema.json
# VMware Tools: the vSphere Client shows an internal version code (12416), the guest's About page the version (12.4.0).
# Advisories name the version. A code (or a Tools build number) typed for vmware-tools is looked up here and stored as
# the version (app/build_maps.py) – an unknown five-digit code is refused, never decoded by guess.
#
# Source (fetched 2026-11-02): VMware's version-mapping file https://packages.vmware.com/tools/versions
#   column 1 (Tools version on NGC/VI Client) and column 5 (Tools build number) → column 4 (Tools version on guest
#   Setup/About page). Rows of the same version are one row here.
# A new version: add its row from the file above and raise catalog_version in catalog.yaml.
kind: names
fetched: "2026-11-02"
sources:
  - "https://packages.vmware.com/tools/versions"
products: [vmware-tools]
strip: [vmware, tools, version, build]
claims: '^\s*(?:(?:vmware\s+)?tools\s+)?(?:version\s*:?\s*)?\d{4,5}\s*$|^\s*\d{8}\s*$'
hint: vmware_tools_names
