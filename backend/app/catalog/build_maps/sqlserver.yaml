# yaml-language-server: $schema=../schema/build_map_names.schema.json
# Microsoft SQL Server: which build a cumulative update (CU), a GDR security update or a KB number is. Admins often say
# "2022 CU16"; Microsoft's CVE records compare builds (16.0.4165.4). A name typed for mssqlserver is looked up here and
# stored as the build (app/build_maps.py) – never guessed. SELECT @@VERSION's whole line is taken too: the build in it
# counts ("Microsoft SQL Server 2022 (RTM-CU16) (KB5048033) - 16.0.4165.4 (X64) …").
#
# Sources (fetched 2026-11-02): Microsoft Support "SQL Server <year> build versions" (one page per release)
#   https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2025/build-versions  (→ KB5005684)
#   https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/build-versions  (→ KB5023451)
#   https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2019/build-versions  (→ KB4518398)
#   https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2017/build-versions  (→ KB4047329)
#   https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2016/build-versions  (→ KB3177312)
# A name Microsoft gives to more than one build ("2022 GDR", "2022 CU24 + GDR" twice, SQL Server 2016's CUs of each
# service pack) is left out – the build or the KB number says it. A CU is its own build: "2022 CU16" is 16.0.4165.4,
# "2022 CU16 GDR" the GDR on top of it.
# A new update: add its row from the pages above and raise catalog_version in catalog.yaml.
kind: names
fetched: "2026-11-02"
sources:
  - "https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2025/build-versions"
  - "https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/build-versions"
  - "https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2019/build-versions"
  - "https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2017/build-versions"
  - "https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2016/build-versions"
products: [mssqlserver]
strip: [microsoft, sql, server]
extract: '(?<![\d.])((?:[6-9]|1\d)\.\d{1,2}\.\d{3,4}(?:\.\d{1,4})?)(?![\d.])'
claims: '(?i)\b(?:rtm|cu\s*\d+|gdr|sp\s*\d|kb\s*\d{6,8})\b|^(?:(?:microsoft\s+)?sql(?:\s+server)?\s+)?20(?:0\d|1\d|2\d)\b'
hint: sqlserver_names
