[project]
name = "cobe-news"
version = "0.1.54"
description = "Self-hosted security news reader (RSS/Atom)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.17.2",
    "httpx==0.28.1",
    "nh3==0.3.7",
    "pydantic==2.13.5",
    "cryptography==50.0.1",
    "aiosmtplib==5.1.3",
    "jinja2==3.1.6",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "ldap3==2.9.1",
    "pyjwt[crypto]==2.15.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosmtpd>=1.4.6",
    "http-ece>=1.2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["host_networks: reads the real /proc/net/route instead of the neutral host networks of the tests"]
pythonpath = ["."]
