# Cobe News – start: docker compose up -d --build  →  https://localhost:8095
# Three images, all built here: the app (Dockerfile), the database (deploy/postgres: PostgreSQL 18 that sets up the
# app's own role at every start) and the proxy (deploy/nginx: nginx with Cobe News' configuration) – no one-shot
# container, nothing of deploy/ mounted. The released images instead: docker-compose.image.yml.
# HTTPS through the bundled nginx (service "proxy"): a self-signed certificate the app makes and renews itself, or your
# own (TLS_MODE=own, TLS_SOURCE). Behind a reverse proxy of your own on this host: PROXY_ENABLED=0 – nothing else
# (docs/BETRIEB.md: HTTPS, 3). Settings come from .env (template: .env.example) – scripts/setup-env.sh creates it once
# with generated database passwords. Data: PostgreSQL 18 (service "db", volume db18). Plain-http redirect port:
# docker-compose.http.yml (docs/BETRIEB.md). Upgrading from 0.1.48 or older: docker compose up -d --build --remove-orphans
# (removes the old container cobe-news-db-init; volumes and ./data stay).
name: cobe-news

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    build: .
    image: cobe-news:latest
    container_name: cobe-news-app
    logging: *logging
    restart: unless-stopped
    mem_limit: ${APP_MEM:-512m}
    pids_limit: 256
    environment:
      BASE_URL: ${BASE_URL:-https://localhost:8095}   # the address in the browser – links in notifications, Entra redirect
      NEWS_HOSTNAME: ${NEWS_HOSTNAME:-}               # FQDN for the self-signed certificate (besides localhost/127.0.0.1)
      TLS_NAMES: ${TLS_NAMES:-}                       # more names/IPs for it, comma separated
      TLS_MODE: ${TLS_MODE:-}                         # selfsigned | own | external; empty: selfsigned, with PROXY_ENABLED=0 external
      TLS_PATH: /tls
      HSTS: ${HSTS:-0}
      PROXY_ENABLED: ${PROXY_ENABLED:-1}              # 0: your own reverse proxy on this host instead of the bundled nginx
      PROXY_IP: ${PROXY_IP:-172.31.250.10}            # the bundled nginx: X-Forwarded-For is trusted from here (and TRUSTED_PROXIES)
      # empty: with PROXY_ENABLED=0 the Docker gateway (this host – the app's port is published on 127.0.0.1 only);
      # set: exactly these instead; "none": nobody (docs/BETRIEB.md: HTTPS, 3)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      EDGE_SUBNET: ${EDGE_SUBNET:-172.31.250.0/24}    # the network edge (below): the gateway is trusted only inside it
      SHARED_ADDRESSES: ${SHARED_ADDRESSES:-}         # addresses many people share: never blocked (docs/BETRIEB.md)
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SECRET_KEY: ${SECRET_KEY:-}                     # empty: a key file in ./data (secret.key, 0600)
      WEBHOOK_HOSTS: ${WEBHOOK_HOSTS:-}               # own webhook hosts besides Teams/Slack, e.g. chat.corp.example
      SMTP_ALLOW_INTERNAL: ${SMTP_ALLOW_INTERNAL:-}   # SMTP relay at an internal address (Docker host), docs/BETRIEB.md
      WEBHOOK_PRIVATE_NETS: ${WEBHOOK_PRIVATE_NETS:-} # private addresses/networks channels may post to (n8n next door), docs/BETRIEB.md
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      CA_FILE: ${CA_FILE:-}
      ALLOW_PRIVATE_FEEDS: ${ALLOW_PRIVATE_FEEDS:-0}
      WEB_PUSH: ${WEB_PUSH:-1}                        # desktop notifications with the tab closed (docs/BETRIEB.md: Web Push)
      PUSH_CONTACT: ${PUSH_CONTACT:-}                 # mailto:/https: contact for the push services; empty: BASE_URL
      POSTGRES_HOST: db
      # the app's own role – owner of the database, no superuser (the db image sets it up; docs/BETRIEB.md: PostgreSQL, Rollen)
      POSTGRES_USER: cobe_news_app
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?missing in .env – run scripts/setup-env.sh once (docs/BETRIEB.md)}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}       # set: backups encrypted, with the key (docs/BETRIEB.md: Sicherung)
      # or the passphrase from a file, e.g. /run/backup-secret/backup-pass – the folder BACKUP_SECRET_DIR (below);
      # BACKUP_PASSPHRASE wins when both are set
      BACKUP_PASSPHRASE_FILE: ${BACKUP_PASSPHRASE_FILE:-}
      # the restore test's throwaway database (its own role, no right on the app's database – the db image makes both
      # when the password is set; empty: no restore test). docs/BETRIEB.md: Rücksicherungs-Test
      POSTGRES_RESTORE_PASSWORD: ${POSTGRES_RESTORE_PASSWORD:-}
      SQLITE_IMPORT: ${SQLITE_IMPORT:-1}              # 0: never move data/news.db (up to 0.1.15) into an empty database (docs/BETRIEB.md)
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-}             # largest request body the app takes (empty: 1 MiB, behind nginx's 1 MB)
    ports:
      # plain http, this machine only: health checks and emergency access. Users come through the proxy (https).
      - "127.0.0.1:${APP_PORT:-8096}:8000"
    volumes:
      - ./data:/data
      - ${TLS_SOURCE:-tls}:/tls   # the app writes its self-signed certificate here (or reads your own to watch its expiry)
      # optional: a folder on the host with the backup passphrase (absolute path, readable for UID 10001) – empty: an
      # empty volume of its own (docs/BETRIEB.md: Sicherung, Passphrase-Datei)
      - ${BACKUP_SECRET_DIR:-backup-secret}:/run/backup-secret:ro
    networks:
      - edge
      - db
    depends_on:
      db:
        condition: service_healthy   # healthy = PostgreSQL up AND the app's role set up for this start
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # PostgreSQL 18 – reachable only from the app (network "db" is internal, no port published). Up to 0.1.15 the data
  # was in data/news.db (SQLite): the first start of 0.1.16 moves it here once and leaves the file as it is (docs/BETRIEB.md).
  # At every start, before it counts as healthy (and so before the app starts), it sets up the app's own role
  # cobe_news_app (no superuser) and its ownership of the database – deploy/postgres/cobe-news-db.sh, db-init.sh. Only
  # this container knows the superuser's password.
  db:
    build: deploy/postgres
    image: cobe-news-db:latest
    container_name: cobe-news-db
    logging: *logging
    restart: unless-stopped
    mem_limit: ${DB_MEM:-512m}
    shm_size: 128m
    environment:
      POSTGRES_USER: cobe_news
      POSTGRES_DB: cobe_news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env – run scripts/setup-env.sh once (docs/BETRIEB.md)}
      # byte order (as SQLite compared), no dependence on the C library's collation (no reindex after an image update)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8"
      # the app's role – its password set again at every start (deploy/postgres/app-role.sql)
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?missing in .env – run scripts/setup-env.sh once (docs/BETRIEB.md)}
      POSTGRES_RESTORE_PASSWORD: ${POSTGRES_RESTORE_PASSWORD:-}   # optional: the restore test's role (restore-role.sql)
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker: the volume is mounted one level up
      - db18:/var/lib/postgresql
    networks:
      - db
    healthcheck:
      # the marker: written after the role set-up of this start, on the tmpfs /var/run/postgresql
      test: ["CMD-SHELL", "test -f /var/run/postgresql/.cobe-news-ready && pg_isready -q -U cobe_news -d cobe_news"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    pids_limit: 256
    read_only: true   # writes only to its volume and these tmpfs
    tmpfs:
      - /var/run/postgresql
      - /tmp
    security_opt:
      - no-new-privileges:true
    # the entrypoint (root) fixes the data folder's owner and switches to the user postgres (also to pass `docker stop`
    # on to it) – nothing else
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  # nginx with Cobe News' configuration in the image (deploy/nginx: the template, 16-server-names.envsh, 40-cert-watch.sh)
  proxy:
    build: deploy/nginx
    image: cobe-news-proxy:latest
    container_name: cobe-news-proxy
    logging: *logging
    restart: unless-stopped
    scale: ${PROXY_ENABLED:-1}
    mem_limit: 128m
    pids_limit: 64
    environment:
      NEWS_HTTPS_PORT: ${PORT:-8095}
      # the names nginx answers to (16-server-names.envsh): BASE_URL's host, NEWS_HOSTNAME, TLS_NAMES, localhost – any
      # other Host header gets a short 421 "Unbekannter Hostname" (docs/BETRIEB.md: HTTPS, Host-Namen)
      NEWS_BASE_URL: ${BASE_URL:-https://localhost:8095}
      NEWS_TLS_HOSTNAME: ${NEWS_HOSTNAME:-}
      NEWS_TLS_NAMES: ${TLS_NAMES:-}
      # only for a warning at the start: published to the network while BASE_URL still names localhost
      NEWS_BIND: ${BIND:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: "^NEWS_"
    ports:
      # with a sign-in in front, BIND=0.0.0.0 may open it to the network (docs/BETRIEB.md)
      - "${BIND:-127.0.0.1}:${PORT:-8095}:443"
    volumes:
      - ${TLS_SOURCE:-tls}:/etc/nginx/tls:ro
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-172.31.250.10}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # the master process reads the certificate and binds 443, the workers run as the user nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

networks:
  # app ↔ proxy, with a fixed address for the proxy (the one the app trusts).
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}
          # dynamic addresses only from the upper half – the proxy's fixed one (.10) is never given to anyone else
          ip_range: ${EDGE_RANGE:-172.31.250.128/25}
          # the address of this host in the network (a reverse proxy on the host comes from it). Empty: Docker takes the
          # first address of EDGE_RANGE – 172.31.250.128 by default. Only for a network created anew (docs/BETRIEB.md:
          # HTTPS, 3); empty keeps an existing network as it is
          gateway: ${EDGE_GATEWAY:-}
  # app ↔ database only: internal (no route out, nothing published)
  db:
    internal: true

volumes:
  tls:
  backup-secret:
  db18:
