# Release: runs only when a release tag is pushed (e.g. `git tag v0.1.47 && git push origin v0.1.47`) – never on
# commits or pull requests. First all checks; only when they are green the image is built, pushed to ghcr.io, signed
# and the GitHub release is written from the matching CHANGELOG.md section.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cobe-news

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version of the tag in every version file and in CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          fail() { echo "::error::$1"; exit 1; }
          grep -q "^__version__ = \"$v\"" backend/app/__init__.py || fail "backend/app/__init__.py is not $v"
          grep -q "^version = \"$v\"" backend/pyproject.toml || fail "backend/pyproject.toml is not $v"
          python3 - "$v" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          lock = open("backend/uv.lock", encoding="utf-8").read()
          m = re.search(r'name = "cobe-news"\nversion = "([^"]+)"', lock)
          assert m and m.group(1) == v, f"backend/uv.lock: cobe-news is {m and m.group(1)}, not {v}"
          pkg = json.load(open("frontend/package.json", encoding="utf-8"))
          assert pkg["version"] == v, f"frontend/package.json is {pkg['version']}, not {v}"
          lock = json.load(open("frontend/package-lock.json", encoding="utf-8"))
          assert lock["version"] == v and lock["packages"][""]["version"] == v, f"frontend/package-lock.json is not {v}"
          PY
          grep -q "^## $v – " CHANGELOG.md || fail "CHANGELOG.md has no section '## $v – …'"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          python-version: "3.13"

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Backend dependencies – known vulnerabilities
        working-directory: backend
        run: uvx pip-audit --strict --requirement requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks, tests and build
        working-directory: frontend
        run: |
          npm ci --no-fund
          npx tsc -b
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Frontend dependencies – known vulnerabilities (shipped packages)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Image (amd64 + arm64), signed
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (cosign / Sigstore)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Cobe News
            org.opencontainers.image.description=Self-hosted security news and vendor advisories
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " – " { on = 1; sub(/^## /, "# "); print; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${v}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\` – signed with cosign (keyless, GitHub OIDC)."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "Cobe News ${TAG#v}" --notes-file notes.md --verify-tag
