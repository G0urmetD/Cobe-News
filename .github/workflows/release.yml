# Release: runs only when a release tag is pushed (e.g. `git tag v0.1.47 && git push origin v0.1.47`) – never on
# commits or pull requests. First all checks; only when they are green the three images (app, database, proxy) are
# built, pushed to ghcr.io and signed, and the GitHub release is written from the matching CHANGELOG.md section.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # lower case: registries and cosign accept only lower-case repository names (the account is G0urmetD)
  IMAGE: ghcr.io/g0urmetd/cobe-news
  # the database (PostgreSQL 18 + the app's role at every start, deploy/postgres) and the proxy (nginx + its
  # configuration, deploy/nginx) – docker-compose.portainer.yml and docker-compose.image.yml run them with the app
  DB_IMAGE: ghcr.io/g0urmetd/cobe-news-db
  PROXY_IMAGE: ghcr.io/g0urmetd/cobe-news-proxy

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version of the tag in every version file and in CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          fail() { echo "::error::$1"; exit 1; }
          grep -q "^__version__ = \"$v\"" backend/app/__init__.py || fail "backend/app/__init__.py is not $v"
          grep -q "^version = \"$v\"" backend/pyproject.toml || fail "backend/pyproject.toml is not $v"
          python3 - "$v" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          lock = open("backend/uv.lock", encoding="utf-8").read()
          m = re.search(r'name = "cobe-news"\nversion = "([^"]+)"', lock)
          assert m and m.group(1) == v, f"backend/uv.lock: cobe-news is {m and m.group(1)}, not {v}"
          pkg = json.load(open("frontend/package.json", encoding="utf-8"))
          assert pkg["version"] == v, f"frontend/package.json is {pkg['version']}, not {v}"
          lock = json.load(open("frontend/package-lock.json", encoding="utf-8"))
          assert lock["version"] == v and lock["packages"][""]["version"] == v, f"frontend/package-lock.json is not {v}"
          PY
          grep -q "^## $v – " CHANGELOG.md || fail "CHANGELOG.md has no section '## $v – …'"

      - name: PostgreSQL 18 client tools (pg_dump, pg_restore, psql – the backup and restore-test tests use them)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          python-version: "3.13"

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Backend dependencies – known vulnerabilities
        working-directory: backend
        run: uvx pip-audit --strict --requirement requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks, tests and build
        working-directory: frontend
        run: |
          npm ci --no-fund
          npx tsc -b
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Frontend dependencies – known vulnerabilities (shipped packages)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Images (amd64 + arm64), signed
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (cosign / Sigstore)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      db-digest: ${{ steps.build-db.outputs.digest }}
      proxy-digest: ${{ steps.build-proxy.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the app
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Cobe News
            org.opencontainers.image.description=Self-hosted security news and vendor advisories
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # the database: PostgreSQL 18 (pinned in deploy/postgres/Dockerfile) with the role set-up of the app
      - id: meta-db
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Cobe News database
            org.opencontainers.image.description=PostgreSQL 18 for Cobe News – sets up the app's own role at every start
            org.opencontainers.image.licenses=MIT

      - id: build-db
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          provenance: mode=max
          sbom: true

      # the proxy: nginx (pinned in deploy/nginx/Dockerfile) with the configuration of Cobe News
      - id: meta-proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PROXY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Cobe News proxy
            org.opencontainers.image.description=nginx for Cobe News – TLS, known host names only, certificate watch
            org.opencontainers.image.licenses=MIT

      - id: build-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DB_DIGEST: ${{ steps.build-db.outputs.digest }}
          PROXY_DIGEST: ${{ steps.build-proxy.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${DB_IMAGE}@${DB_DIGEST}"
          cosign sign --yes "${PROXY_IMAGE}@${PROXY_DIGEST}"

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          DB_DIGEST: ${{ needs.image.outputs.db-digest }}
          PROXY_DIGEST: ${{ needs.image.outputs.proxy-digest }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " – " { on = 1; sub(/^## /, "# "); print; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Images"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${v}"
            echo "docker pull ${DB_IMAGE}:${v}"
            echo "docker pull ${PROXY_IMAGE}:${v}"
            echo '```'
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE}:${v}\` | \`${DIGEST}\` |"
            echo "| \`${DB_IMAGE}:${v}\` | \`${DB_DIGEST}\` |"
            echo "| \`${PROXY_IMAGE}:${v}\` | \`${PROXY_DIGEST}\` |"
            echo
            echo "All three signed with cosign (keyless, GitHub OIDC). Portainer: docker-compose.portainer.yml of this tag (COBE_NEWS_VERSION=${v})."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "Cobe News ${TAG#v}" --notes-file notes.md --verify-tag
