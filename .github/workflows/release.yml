# Release: runs only when a release tag is pushed (e.g. `git tag v0.1.51 && git push origin v0.1.51`) – never on
# commits or pull requests. First all checks; only when they are green the three images (app, database, proxy) are
# built and pushed to ghcr.io by digest only (no tag yet) and signed; only when all three are built and signed, and the
# signatures and attestations check out, the job "publish" puts the version tag on the three signed digests – and
# `latest`, only when this tag is the highest release so far (a backport never moves it back) – without a rebuild;
# then the GitHub release is written from the matching CHANGELOG.md section, with the reports of the image scan (Trivy,
# before signing: a high or critical finding with a fixed version stops the release – docs/SICHERHEIT-SCANS.md).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # lower case: registries and cosign accept only lower-case repository names (the account is G0urmetD)
  IMAGE: ghcr.io/g0urmetd/cobe-news
  # the database (PostgreSQL 18 + the app's role at every start, deploy/postgres) and the proxy (nginx + its
  # configuration, deploy/nginx) – docker-compose.portainer.yml and docker-compose.image.yml run them with the app
  DB_IMAGE: ghcr.io/g0urmetd/cobe-news-db
  PROXY_IMAGE: ghcr.io/g0urmetd/cobe-news-proxy

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version of the tag in every version file and in CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          fail() { echo "::error::$1"; exit 1; }
          grep -q "^__version__ = \"$v\"" backend/app/__init__.py || fail "backend/app/__init__.py is not $v"
          grep -q "^version = \"$v\"" backend/pyproject.toml || fail "backend/pyproject.toml is not $v"
          python3 - "$v" <<'PY'
          import json, re, sys
          v = sys.argv[1]
          lock = open("backend/uv.lock", encoding="utf-8").read()
          m = re.search(r'name = "cobe-news"\nversion = "([^"]+)"', lock)
          assert m and m.group(1) == v, f"backend/uv.lock: cobe-news is {m and m.group(1)}, not {v}"
          pkg = json.load(open("frontend/package.json", encoding="utf-8"))
          assert pkg["version"] == v, f"frontend/package.json is {pkg['version']}, not {v}"
          lock = json.load(open("frontend/package-lock.json", encoding="utf-8"))
          assert lock["version"] == v and lock["packages"][""]["version"] == v, f"frontend/package-lock.json is not {v}"
          PY
          grep -q "^## $v – " CHANGELOG.md || fail "CHANGELOG.md has no section '## $v – …'"

      - name: PostgreSQL 18 client tools (pg_dump, pg_restore, psql – the backup and restore-test tests use them)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # the signing key from the repository, checked like in the Dockerfile – no download from www.postgresql.org
          echo "0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76  keys/pgdg-ACCC4CF8.asc" | sha256sum -c -
          sudo install -m 644 keys/pgdg-ACCC4CF8.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          python-version: "3.13"

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Backend dependencies – known vulnerabilities
        working-directory: backend
        run: uvx pip-audit --strict --requirement requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks, tests and build
        working-directory: frontend
        run: |
          npm ci --no-fund
          npx tsc -b
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Frontend dependencies – known vulnerabilities (shipped packages)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # build, scan and sign – by digest only: nothing here moves a tag, so a failure (also of the scan) leaves no tag behind
  # (only untagged digests)
  image:
    name: Images (amd64 + arm64), by digest, signed
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (cosign / Sigstore)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      db-digest: ${{ steps.build-db.outputs.digest }}
      proxy-digest: ${{ steps.build-proxy.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the app
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Cobe News
            org.opencontainers.image.description=Self-hosted security news and vendor advisories
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # the database: PostgreSQL 18 (pinned in deploy/postgres/Dockerfile) with the role set-up of the app
      - id: meta-db
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DB_IMAGE }}
          labels: |
            org.opencontainers.image.title=Cobe News database
            org.opencontainers.image.description=PostgreSQL 18 for Cobe News – sets up the app's own role at every start
            org.opencontainers.image.licenses=MIT

      - id: build-db
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.DB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta-db.outputs.labels }}
          provenance: mode=max
          sbom: true

      # the proxy: nginx (pinned in deploy/nginx/Dockerfile) with the configuration of Cobe News
      - id: meta-proxy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PROXY_IMAGE }}
          labels: |
            org.opencontainers.image.title=Cobe News proxy
            org.opencontainers.image.description=nginx for Cobe News – TLS, known host names only, certificate watch
            org.opencontainers.image.licenses=MIT

      - id: build-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/nginx
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.PROXY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta-proxy.outputs.labels }}
          provenance: mode=max
          sbom: true

      # Trivy for the scan below – no third-party action: this version's archive from Trivy's GitHub release, checked
      # against its checksum (from the release's checksum list, whose signature by Trivy's release workflow is checked
      # with cosign when the version is raised – docs/BETRIEB.md: Release); scripts/scan-images.sh runs the same version
      - name: Trivy (pinned version, checksum checked)
        env:
          TRIVY_VERSION: "0.76.2"
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      # before signing: the three images exactly as pushed (their digests), both platforms. A high or critical finding
      # that has a fixed version stops the release here – nothing signed, no tag (only untagged digests, as with any
      # failure); findings without a fix are reported, not fatal (docs/SICHERHEIT-SCANS.md). The full reports (every
      # severity, also without a fix) go to the GitHub release
      - id: scan
        name: Scan the images (Trivy – fails on a fixable high or critical finding)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DB_DIGEST: ${{ steps.build-db.outputs.digest }}
          PROXY_DIGEST: ${{ steps.build-proxy.outputs.digest }}
          OUT: trivy-reports
          PLATFORMS: linux/amd64 linux/arm64
          TRIVY_IMAGE_SRC: remote # from ghcr.io (pushed by digest, not in the runner's Docker)
        run: scripts/scan-images.sh "${IMAGE}@${DIGEST}" "${DB_IMAGE}@${DB_DIGEST}" "${PROXY_IMAGE}@${PROXY_DIGEST}"

      # also when the scan failed: the reports say why
      - name: Keep the scan reports (for the GitHub release)
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: trivy-reports/
          if-no-files-found: error
          retention-days: 30
          overwrite: true # a re-run of the job replaces them

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # the digest of each multi-arch index – it holds the images and their provenance and SBOM attestations, so the
      # signature covers all of it and still holds for every tag put on that digest later
      - name: Sign the images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DB_DIGEST: ${{ steps.build-db.outputs.digest }}
          PROXY_DIGEST: ${{ steps.build-proxy.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${DB_IMAGE}@${DB_DIGEST}"
          cosign sign --yes "${PROXY_IMAGE}@${PROXY_DIGEST}"

  # the tags – only after all three are built and signed: the version on the signed digests (no rebuild, the same
  # index), `latest` only when this tag is the highest release; one at a time across tags (two releases never race
  # for latest)
  publish:
    name: Tags on the signed digests (version, latest)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-tags
      cancel-in-progress: false
    outputs:
      latest: ${{ steps.latest.outputs.move }}
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      DB_DIGEST: ${{ needs.image.outputs.db-digest }}
      PROXY_DIGEST: ${{ needs.image.outputs.proxy-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all release tags: is this the highest?

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # before any tag: each digest signed by this workflow at this tag, and carrying its provenance and SBOM
      # (an attestation manifest per platform in the index)
      - name: Check signatures and attestations
        run: |
          set -euo pipefail
          for ref in "${IMAGE}@${DIGEST}" "${DB_IMAGE}@${DB_DIGEST}" "${PROXY_IMAGE}@${PROXY_DIGEST}"; do
            cosign verify "$ref" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            n=$(docker buildx imagetools inspect --raw "$ref" \
              | jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length')
            if [ "$n" -lt 2 ]; then
              echo "::error::$ref: $n attestation manifests, expected one per platform (provenance + SBOM)"
              exit 1
            fi
            echo "$ref: signed, $n attestation manifests"
          done

      - id: latest
        name: Is this the highest release so far?
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          highest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" = "$highest" ]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is the highest release – latest moves to it"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the highest release ($highest) – latest stays"
          fi

      # `imagetools create` with a single source copies it as it is: the same index under a new tag (checked below –
      # a different digest would not be what was signed)
      - name: Version tag (and latest) on the signed digests
        env:
          TAG: ${{ github.ref_name }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          put() {
            docker buildx imagetools create --tag "$1:$3" "$1@$2"
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$1:$3" | jq -r .digest)
            if [ "$got" != "$2" ]; then
              echo "::error::$1:$3 points to $got, not to the signed $2"
              exit 1
            fi
            echo "$1:$3 → $2"
          }
          put "$IMAGE" "$DIGEST" "$v"
          put "$DB_IMAGE" "$DB_DIGEST" "$v"
          put "$PROXY_IMAGE" "$PROXY_DIGEST" "$v"
          if [ "$MOVE_LATEST" = true ]; then
            put "$IMAGE" "$DIGEST" latest
            put "$DB_IMAGE" "$DB_DIGEST" latest
            put "$PROXY_IMAGE" "$PROXY_DIGEST" latest
          fi

  release:
    name: GitHub release
    needs: [image, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the reports of the scan in the job "image" (the digests of this release)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-reports
          path: trivy-reports

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          DB_DIGEST: ${{ needs.image.outputs.db-digest }}
          PROXY_DIGEST: ${{ needs.image.outputs.proxy-digest }}
          LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## " v " – " { on = 1; sub(/^## /, "# "); print; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Images"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${v}"
            echo "docker pull ${DB_IMAGE}:${v}"
            echo "docker pull ${PROXY_IMAGE}:${v}"
            echo '```'
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE}:${v}\` | \`${DIGEST}\` |"
            echo "| \`${DB_IMAGE}:${v}\` | \`${DB_DIGEST}\` |"
            echo "| \`${PROXY_IMAGE}:${v}\` | \`${PROXY_DIGEST}\` |"
            echo
            echo "All three signed with cosign (keyless, GitHub OIDC) – the signature covers the digest, every tag on it verifies."
            if [ "$LATEST" = true ]; then
              echo "\`latest\` points to this release."
            else
              echo "\`latest\` stays on a higher release (this one is a backport)."
            fi
            echo "Portainer: docker-compose.portainer.yml of this tag (COBE_NEWS_VERSION=${v})."
            echo
            # the scan's summary (counts per image and platform, the gate) – one heading level down
            sed '1s/^# /## /' trivy-reports/summary.md
            echo
            echo "Full reports attached: \`trivy-<image reference>-<platform>.txt\` (table) and \`.json\`. Why findings without a fix remain: docs/SICHERHEIT-SCANS.md."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "Cobe News ${TAG#v}" --notes-file notes.md --verify-tag trivy-reports/trivy-*
